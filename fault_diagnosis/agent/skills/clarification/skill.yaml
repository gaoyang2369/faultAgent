name: clarification
version: "0.1.0"
description: Ask a targeted clarification when required context is missing or ambiguous.
trigger_intents:
  - clarification
required_slots: []
optional_slots:
  - candidates
  - missing_context
required_evidence: []
allowed_nodes:
  - clarification
allowed_tools: []
forbidden_tools:
  - sql.read
  - kb.search
  - workorder.dispatch
  - device_control.write
risk_level: low
output_variants:
  - clarification_question
fallback_policy: ask_one_question
slot_policy:
  required: []
  optional:
    - candidates
    - missing_context
  inherit_allowed: []
  inherit_forbidden:
    - ambiguous_device_refs
    - ambiguous_fault_code_refs
evidence_policy:
  required: []
  optional:
    - candidate_context
  freshness_policy: not_applicable
  missing_evidence_behavior: ask_one_question
node_policy:
  required_nodes:
    - clarification
  optional_nodes: []
  forbidden_nodes:
    - sql
    - rag
    - analysis
    - report
    - workorder
output_contract:
  variants:
    - clarification_question
  required_fields:
    - question
  forbidden_claims:
    - inferred_ambiguous_target
safety_contract:
  forbidden_actions:
    - tool_execution
    - device_action
    - workorder
  manual_confirmation_required: false
  draft_only: false
composition:
  can_compose_with: []
  preferred_primary_when_composed: clarification
  dependency_rules: []
