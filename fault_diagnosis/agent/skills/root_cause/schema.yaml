input:
  device:
    type: string
    required: true
  fault_code:
    type: string
    required: false
output:
  root_cause_candidates:
    type: array
    required: true
    items:
      type: object
      required_fields:
        - supporting_evidence
        - missing_evidence
        - confidence
      properties:
        candidate:
          type: string
        supporting_evidence:
          type: array
        missing_evidence:
          type: array
        confidence:
          type: number
  definitive_root_cause:
    forbidden_without_evidence: true
