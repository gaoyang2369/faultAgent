input:
  device:
    type: string
    required: true
  evidence_bundle:
    type: string
    required: false
output:
  need_workorder:
    type: boolean
    required: true
  reason:
    type: string
    required: true
  evidence_summary:
    type: array
    required: true
  draft_payload:
    type: object
    required: false
  draft_only:
    type: boolean
    const: true
    required: true
  manual_confirmation_required:
    type: boolean
    const: true
    required: true
  lifecycle_actions:
    forbidden:
      - dispatch
      - assign
      - execute
      - close
