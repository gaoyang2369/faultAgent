name: report_generation
version: "0.1.0"
description: Generate a report from validated evidence or a referenced artifact.
trigger_intents:
  - generate_report
required_slots:
  - report_source
optional_slots:
  - device
  - fault_code
  - evidence_bundle
required_evidence:
  - reportable_artifact
allowed_nodes:
  - report
allowed_tools:
  - report.write_draft
forbidden_tools:
  - workorder.dispatch
  - device_control.write
risk_level: low
output_variants:
  - report
fallback_policy: ask_for_report_source_or_refresh
