name: runtime_status
version: "0.1.0"
description: Check current or recent runtime status for an explicitly scoped device.
trigger_intents:
  - check_current_status
required_slots:
  - device
optional_slots:
  - time_window
  - fault_code
required_evidence:
  - latest_runtime_status
  - asset_identity
  - data_source
  - sample_window
  - latest_sample_time
  - row_count
  - freshness
  - runtime_status
allowed_nodes:
  - sql
  - comparison
allowed_tools:
  - sql.read
forbidden_tools:
  - sql.write
  - device_control.write
risk_level: medium
output_variants:
  - answer
  - status_brief
fallback_policy: ask_for_device
slot_policy:
  required:
    - device_refs
  optional:
    - time_window
    - fault_code_refs
  inherit_allowed:
    - device_refs
    - time_window
  inherit_forbidden: []
evidence_policy:
  required:
    - asset_identity
    - data_source
    - sample_window
    - latest_sample_time
    - row_count
    - freshness
    - runtime_status
  optional:
    - event_codes
    - metric_snapshot
  freshness_policy: calculate_and_disclose
  missing_evidence_behavior: partial_disclose
node_policy:
  required_nodes:
    - sql
  optional_nodes: []
  forbidden_nodes:
    - workorder
    - report
output_contract:
  variants:
    - answer
    - status_brief
  required_fields:
    - runtime_status
    - status_reasons
    - data_basis
    - data_window
    - resolved_window
    - latest_sample_time
    - freshness_disclosure
    - supporting_evidence_ids
  forbidden_claims:
    - current_without_freshness
    - root_cause_conclusion
    - fault_attribution_without_diagnosis_permission
safety_contract:
  forbidden_actions:
    - device_action
    - alarm_acknowledge
    - alarm_close
  manual_confirmation_required: false
  draft_only: false
composition:
  can_compose_with:
    - fault_code_explain
    - alarm_triage
    - root_cause
    - workorder_decision
  preferred_primary_when_composed: alarm_triage
  dependency_rules:
    - when: fault_code_explain_selected
      promote: alarm_triage
