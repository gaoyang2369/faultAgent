schema_version: canonical_turn_phase2_eval.v1
cases:
- id: phase2_current_status
  name: Phase 2 当前状态强制执行
  tier: core
  eval_modes: [plan]
  role: engineer
  identity_fixture: engineer_j1.json
  artifact_fixture: null
  turns: ["查询 J1 当前运行状态"]
  expected:
    route:
      primary_skill: runtime_status
      selected_skills: [runtime_status]
    effective_request:
      requested_goals: [check_runtime_status]
      effective_device_refs: [J1]
    plan:
      node_types_contains: [sql]
      node_types_absent: [report, workorder]
      status: validated
    workflow:
      must_skip: [report, workorder_decision]

